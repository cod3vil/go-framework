# go-framework 配置文件
# 所有配置项均可用环境变量覆盖，前缀 APP，层级用下划线连接，
# 如 APP_SERVER_PORT=9000 覆盖 server.port。

app:
  name: go-framework
  mode: debug # debug / release / test
  captcha_enabled: true # 登录图形验证码开关

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 60
  write_timeout: 60
  shutdown_timeout: 15
  rate_limit: 0 # 每秒请求数上限，0 不限流
  rate_burst: 100

log:
  level: debug # debug / info / warn / error
  format: console # console / json
  filename: "" # 为空仅输出 stdout；如 logs/app.log 则同时写滚动文件
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true

database:
  driver: postgres # postgres / mysql / sqlite
  dsn: host=127.0.0.1 user=postgres password=postgres dbname=app port=5432 sslmode=disable TimeZone=Asia/Shanghai
  # mysql 示例: user:pass@tcp(127.0.0.1:3306)/dbname?charset=utf8mb4&parseTime=True&loc=Local
  # sqlite 示例(本地快速体验): driver: sqlite, dsn: data/app.db
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600
  log_level: info # silent / error / warn / info

redis:
  addr: 127.0.0.1:6379 # 为空时降级为内存缓存
  password: ""
  db: 0

jwt:
  secret: "change-me-in-production" # 生产环境务必修改或用 APP_JWT_SECRET 覆盖
  access_expire: 120 # 分钟
  refresh_expire: 10080 # 分钟（7 天）
  issuer: go-framework

tenant:
  enabled: false # 多租户开关（仅 PostgreSQL）。开启后各租户数据按 schema 隔离
  header_key: X-Tenant # 登录等无令牌请求携带租户编码的请求头
  max_conns_per_tenant: 10 # 每个租户连接池上限

upload:
  driver: local # 当前支持 local（预留 oss/s3）
  dir: data/uploads # 本地存储根目录
  url_prefix: /uploads # 对外访问前缀
  max_size_mb: 20 # 单文件大小上限
  allowed_exts: # 允许的扩展名（小写含点），留空表示不限制
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .webp
    - .pdf
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .zip
    - .txt
    - .csv
